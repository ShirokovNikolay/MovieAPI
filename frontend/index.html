<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Каталог фильмов — вход и регистрация</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="css/app.css" rel="stylesheet">
</head>
<body>
<div id="app"></div>

<script type="text/x-template" id="app-template">
    <div>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary">
            <div class="container">
                <a class="navbar-brand" href="#/">Movie Catalog</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain"
                        aria-controls="navMain" aria-expanded="false" aria-label="Меню">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navMain">
                    <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                        <template v-if="!isAuthenticated">
                            <li class="nav-item">
                                <a class="nav-link" href="#/login" :class="{ active: currentView === 'login' }">Вход</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="#/register" :class="{ active: currentView === 'register' }">Регистрация</a>
                            </li>
                        </template>
                        <template v-else>
                            <li class="nav-item">
                                <span class="navbar-text text-secondary me-3">{{ displayLogin }}</span>
                            </li>
                            <li class="nav-item">
                                <button type="button" class="btn btn-outline-light btn-sm mt-1" @click="onLogout">Выйти</button>
                            </li>
                        </template>
                    </ul>
                </div>
            </div>
        </nav>

        <main class="container py-5">
            <div v-if="error" class="alert alert-danger" role="alert">{{ error }}</div>
            <div v-if="success && currentView === 'register'" class="alert alert-success" role="alert">{{ success }}</div>

            <div v-if="currentView === 'login'" class="row justify-content-center">
                <div class="col-12 auth-card">
                    <div class="card shadow text-bg-dark border-secondary">
                        <div class="card-body p-4">
                            <h1 class="h4 mb-4">Вход</h1>
                            <form @submit.prevent="onLogin">
                                <div class="mb-3">
                                    <label class="form-label" for="login-username">Логин</label>
                                    <input id="login-username" v-model="loginForm.username" type="text"
                                           class="form-control bg-dark text-light border-secondary" required
                                           minlength="3" maxlength="20" autocomplete="username">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label" for="login-password">Пароль</label>
                                    <input id="login-password" v-model="loginForm.password" type="password"
                                           class="form-control bg-dark text-light border-secondary" required
                                           minlength="8" maxlength="30" autocomplete="current-password">
                                </div>
                                <button type="submit" class="btn btn-primary w-100" :disabled="loading">
                                    <span v-if="loading" class="spinner-border spinner-border-sm me-1" role="status"></span>
                                    Войти
                                </button>
                            </form>
                            <p class="mt-3 mb-0 text-secondary small">
                                Нет аккаунта?
                                <a href="#/register" class="link-light">Зарегистрироваться</a>
                            </p>
                        </div>
                    </div>
                </div>
            </div>

            <div v-else-if="currentView === 'register'" class="row justify-content-center">
                <div class="col-12 col-lg-8">
                    <div class="card shadow text-bg-dark border-secondary">
                        <div class="card-body p-4">
                            <h1 class="h4 mb-4">Регистрация</h1>
                            <form @submit.prevent="onRegister">
                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <label class="form-label" for="reg-surname">Фамилия</label>
                                        <input id="reg-surname" v-model="registerForm.surname" type="text"
                                               class="form-control bg-dark text-light border-secondary" required
                                               minlength="3" maxlength="30" autocomplete="family-name">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label" for="reg-name">Имя</label>
                                        <input id="reg-name" v-model="registerForm.name" type="text"
                                               class="form-control bg-dark text-light border-secondary" required
                                               minlength="3" maxlength="20" autocomplete="given-name">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label" for="reg-login">Логин</label>
                                        <input id="reg-login" v-model="registerForm.login" type="text"
                                               class="form-control bg-dark text-light border-secondary" required
                                               minlength="3" maxlength="20" autocomplete="username">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label" for="reg-email">Email</label>
                                        <input id="reg-email" v-model="registerForm.email" type="email"
                                               class="form-control bg-dark text-light border-secondary" required
                                               minlength="10" maxlength="40" autocomplete="email">
                                    </div>
                                    <div class="col-12">
                                        <label class="form-label" for="reg-password">Пароль</label>
                                        <input id="reg-password" v-model="registerForm.password" type="password"
                                               class="form-control bg-dark text-light border-secondary" required
                                               minlength="8" maxlength="30" autocomplete="new-password">
                                    </div>
                                </div>
                                <button type="submit" class="btn btn-primary mt-4" :disabled="loading">
                                    <span v-if="loading" class="spinner-border spinner-border-sm me-1" role="status"></span>
                                    Зарегистрироваться
                                </button>
                            </form>
                            <p class="mt-3 mb-0 text-secondary small">
                                Уже есть аккаунт?
                                <a href="#/login" class="link-light">Войти</a>
                            </p>
                        </div>
                    </div>
                </div>
            </div>

            <div v-else-if="currentView === 'home'" class="row justify-content-center">
                <div class="col-12 col-lg-8">
                    <div class="card shadow text-bg-dark border-secondary">
                        <div class="card-body p-4">
                            <h1 class="h4 mb-3">Добро пожаловать</h1>
                            <p class="text-secondary mb-4">
                                Вы вошли как <strong class="text-light">{{ displayLogin }}</strong>.
                                Access- и refresh-токены сохранены в <code class="text-info">localStorage</code>.
                                Перед защищёнными запросами вызывайте
                                <code class="text-info">Api.ensureValidAccessToken()</code> или
                                <code class="text-info">Api.authFetch()</code> — при истечении access токен
                                обновится через <code class="text-info">/api/v1/auth/refresh</code>.
                            </p>
                            <div class="d-flex flex-wrap gap-2">
                                <button type="button" class="btn btn-outline-primary btn-sm" @click="demoEnsureAccess">
                                    Проверить / обновить access
                                </button>
                                <button type="button" class="btn btn-outline-secondary btn-sm" @click="demoRefresh">
                                    Принудительно refresh
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script src="js/config.js"></script>
<script src="js/tokenStore.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
</body>
</html>
