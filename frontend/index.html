<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Каталог фильмов</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/app.css" rel="stylesheet">
</head>
<body>
<div id="app">
    <div class="container py-5 text-light text-center boot-fallback">
        <p class="mb-0">Загрузка интерфейса…</p>
        <p class="small text-secondary mt-2">Если экран не меняется, проверьте консоль браузера (F12) и доступность скриптов.</p>
    </div>
</div>

<script type="text/x-template" id="app-template">
    <div>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary">
            <div class="container">
                <a class="navbar-brand" href="#/">Movie Catalog</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain"
                        aria-controls="navMain" aria-expanded="false" aria-label="Меню">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navMain">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link" href="#/" :class="{ active: currentView === 'catalog' }">Главная</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#/genres" :class="{ active: currentView === 'genres' }">Жанры</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#/movies" :class="{ active: currentView === 'movies' }">Фильмы</a>
                        </li>
                    </ul>
                    <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-lg-center">
                        <template v-if="!isAuthenticated">
                            <li class="nav-item me-lg-2">
                                <a class="btn btn-outline-primary btn-sm mt-1" href="#/login"
                                   :class="{ active: currentView === 'login' }">Войти</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link py-2" href="#/register" :class="{ active: currentView === 'register' }">Регистрация</a>
                            </li>
                        </template>
                        <template v-else>
                            <li class="nav-item d-none d-md-flex align-items-center me-lg-2">
                                <span class="navbar-text text-secondary">{{ displayLogin }}</span>
                            </li>
                            <li class="nav-item me-lg-2">
                                <a class="btn btn-outline-info btn-sm mt-1" href="#/profile">Профиль</a>
                            </li>
                            <li class="nav-item d-md-none me-lg-2">
                                <span class="navbar-text text-secondary small">{{ displayLogin }}</span>
                            </li>
                            <li class="nav-item">
                                <button type="button" class="btn btn-outline-light btn-sm mt-1" @click="onLogout">Выйти</button>
                            </li>
                        </template>
                    </ul>
                </div>
            </div>
        </nav>

        <main class="container py-5">
            <div v-if="error" class="alert alert-danger" role="alert">{{ error }}</div>
            <div v-if="success && currentView === 'register'" class="alert alert-success" role="alert">{{ success }}</div>
            <div v-if="profileSuccess && currentView === 'profile'" class="alert alert-success" role="alert">{{ profileSuccess }}</div>

            <div v-if="currentView === 'login'" class="row justify-content-center">
                <div class="col-12 auth-card">
                    <div class="card shadow text-bg-dark border-secondary">
                        <div class="card-body p-4">
                            <h1 class="h4 mb-4">Вход</h1>
                            <form @submit.prevent="onLogin">
                                <div class="mb-3">
                                    <label class="form-label" for="login-username">Логин</label>
                                    <input id="login-username" v-model="loginForm.username" type="text"
                                           class="form-control bg-dark text-light border-secondary" required
                                           minlength="3" maxlength="20" autocomplete="username">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label" for="login-password">Пароль</label>
                                    <input id="login-password" v-model="loginForm.password" type="password"
                                           class="form-control bg-dark text-light border-secondary" required
                                           minlength="8" maxlength="30" autocomplete="current-password">
                                </div>
                                <button type="submit" class="btn btn-primary w-100" :disabled="loading">
                                    <span v-if="loading" class="spinner-border spinner-border-sm me-1" role="status"></span>
                                    Войти
                                </button>
                            </form>
                            <p class="mt-3 mb-0 text-secondary small">
                                Нет аккаунта?
                                <a href="#/register" class="link-light">Зарегистрироваться</a>
                            </p>
                        </div>
                    </div>
                </div>
            </div>

            <div v-else-if="currentView === 'register'" class="row justify-content-center">
                <div class="col-12 col-lg-8">
                    <div class="card shadow text-bg-dark border-secondary">
                        <div class="card-body p-4">
                            <h1 class="h4 mb-4">Регистрация</h1>
                            <form @submit.prevent="onRegister">
                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <label class="form-label" for="reg-surname">Фамилия</label>
                                        <input id="reg-surname" v-model="registerForm.surname" type="text"
                                               class="form-control bg-dark text-light border-secondary" required
                                               minlength="3" maxlength="30" autocomplete="family-name">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label" for="reg-name">Имя</label>
                                        <input id="reg-name" v-model="registerForm.name" type="text"
                                               class="form-control bg-dark text-light border-secondary" required
                                               minlength="3" maxlength="20" autocomplete="given-name">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label" for="reg-login">Логин</label>
                                        <input id="reg-login" v-model="registerForm.login" type="text"
                                               class="form-control bg-dark text-light border-secondary" required
                                               minlength="3" maxlength="20" autocomplete="username">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label" for="reg-email">Email</label>
                                        <input id="reg-email" v-model="registerForm.email" type="email"
                                               class="form-control bg-dark text-light border-secondary" required
                                               minlength="10" maxlength="40" autocomplete="email">
                                    </div>
                                    <div class="col-12">
                                        <label class="form-label" for="reg-password">Пароль</label>
                                        <input id="reg-password" v-model="registerForm.password" type="password"
                                               class="form-control bg-dark text-light border-secondary" required
                                               minlength="8" maxlength="30" autocomplete="new-password">
                                    </div>
                                </div>
                                <button type="submit" class="btn btn-primary mt-4" :disabled="loading">
                                    <span v-if="loading" class="spinner-border spinner-border-sm me-1" role="status"></span>
                                    Зарегистрироваться
                                </button>
                            </form>
                            <p class="mt-3 mb-0 text-secondary small">
                                Уже есть аккаунт?
                                <a href="#/login" class="link-light">Войти</a>
                            </p>
                        </div>
                    </div>
                </div>
            </div>

            <div v-else-if="currentView === 'catalog'" class="row justify-content-center">
                <div class="col-12 col-lg-10 col-xl-9">
                    <div class="card shadow text-bg-dark border-secondary mb-4">
                        <div class="card-body p-4 p-lg-5">
                            <h1 class="h2 mb-3">Каталог фильмов</h1>
                            <p class="lead text-secondary mb-0">
                                Добро пожаловать. Просматривайте жанры без регистрации или войдите в аккаунт для персональных функций — всё это доступно из шапки сайта.
                            </p>
                        </div>
                    </div>
                </div>
            </div>

            <div v-else-if="currentView === 'genres'" class="row justify-content-center">
                <div class="col-12 px-0 px-md-2">
                    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
                        <a href="#/" class="link-light text-decoration-none">← На главную</a>
                    </div>
                    <div class="card shadow text-bg-dark border-secondary mb-3">
                        <div class="card-body p-4 p-lg-5">
                            <h2 class="h3 mb-4">Жанры</h2>
                            <form class="row g-3 align-items-end" @submit.prevent="applyGenreSearch">
                                <div class="col-12 col-md-8 col-lg-7 col-xl-6">
                                    <label class="form-label text-secondary small mb-1" for="genre-search">Поиск по имени</label>
                                    <input id="genre-search" v-model="genreSearchInput" type="text"
                                           class="form-control bg-dark text-light border-secondary"
                                           placeholder="Введите часть названия жанра"
                                           maxlength="30"
                                           autocomplete="off">
                                </div>
                                <div class="col-auto">
                                    <button type="submit" class="btn btn-primary" :disabled="genreLoading">Найти</button>
                                </div>
                                <div class="col-auto" v-if="genreActiveSearch">
                                    <button type="button" class="btn btn-outline-secondary" :disabled="genreLoading" @click="clearGenreSearch">
                                        Сбросить поиск
                                    </button>
                                </div>
                            </form>
                            <p v-if="genreActiveSearch" class="small text-secondary mt-2 mb-0">
                                Результаты по запросу: «<span class="text-light">{{ genreActiveSearch }}</span>»
                            </p>
                        </div>
                    </div>
                    <div v-if="genreLoading" class="text-center py-5 text-secondary">
                        <div class="spinner-border text-info" role="status"><span class="visually-hidden">Загрузка…</span></div>
                    </div>
                    <div v-else class="card shadow text-bg-dark border-secondary genre-list-card">
                        <div class="genre-list-scroll">
                            <div v-if="genreList.length === 0" class="text-secondary py-5 px-4 text-center">
                                Нет данных на этой странице.
                            </div>
                            <article
                                v-for="g in genreList"
                                :key="g.id"
                                class="genre-row d-flex flex-column flex-md-row gap-3 gap-md-4 p-4 p-lg-5 border-bottom border-secondary"
                            >
                                <div class="genre-row-text flex-grow-1 min-w-0">
                                    <h3 class="h4 text-light mb-3 mb-md-2">{{ g.name }}</h3>
                                    <p class="text-secondary mb-0 genre-row-description">{{ g.description }}</p>
                                </div>
                                <div
                                    class="genre-poster-slot flex-shrink-0 align-self-stretch align-self-md-start"
                                    role="img"
                                    aria-label="Место для постера жанра"
                                >
                                    <span class="visually-hidden">Постер не загружен</span>
                                </div>
                            </article>
                        </div>
                        <div class="card-footer border-secondary d-flex flex-wrap justify-content-between align-items-center gap-2 py-3 px-4">
                            <span class="text-secondary small">Страница {{ genrePage }}, по {{ genreSize }} записей</span>
                            <div class="btn-group">
                                <button type="button" class="btn btn-outline-light btn-sm" :disabled="!genreHasPrev || genreLoading" @click="goGenrePage(genrePage - 1)">Назад</button>
                                <button type="button" class="btn btn-outline-light btn-sm" :disabled="!genreHasNext || genreLoading" @click="goGenrePage(genrePage + 1)">Вперёд</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Секция фильмов -->
            <div v-else-if="currentView === 'movies'" class="row justify-content-center">
                <div class="col-12">
                    <div class="card shadow text-bg-dark border-secondary mb-4">
                        <div class="card-body p-4">
                            <h1 class="h3 mb-0">🎬 Список фильмов</h1>
                        </div>
                    </div>

                    <div v-if="moviesLoading" class="text-center py-5">
                        <div class="spinner-border text-info" role="status">
                            <span class="visually-hidden">Загрузка...</span>
                        </div>
                    </div>

                    <div v-else-if="moviesList.length === 0" class="card shadow text-bg-dark border-secondary">
                        <div class="card-body p-5 text-center text-secondary">
                            <h3 class="h5">😔 Фильмы не найдены</h3>
                        </div>
                    </div>

                    <div v-else class="row g-4">
                        <div v-for="movie in moviesList" :key="movie.id" class="col-md-6 col-lg-4">
                            <div class="card h-100 bg-dark text-light border-secondary hover-card">
                                <!-- Постер сверху -->
                                <img :src="movie.preview_url || 'https://via.placeholder.com/300x200?text=No+Image'"
                                     class="card-img-top"
                                     alt="Постер"
                                     style="height: 200px; object-fit: cover;">

                                <div class="card-body">
                                    <!-- Название и жанр сверху -->
                                    <div class="d-flex justify-content-between align-items-start mb-2">
                                        <h5 class="card-title mb-0">{{ movie.name }}</h5>
                                        <span class="badge bg-info text-dark">{{ movie.genre.name }}</span>
                                    </div>

                                    <!-- Рейтинг -->
                                    <div class="mb-2">
                                        <span class="text-warning">⭐</span>
                                        <span class="ms-1">{{ movie.rating }}/10</span>
                                    </div>

                                    <!-- Дата релиза -->
                                    <p class="card-text small text-secondary mb-2">
                                        📅 {{ formatDate(movie.release_date) }}
                                    </p>

                                    <!-- Описание (обрезаем) -->
                                    <p class="card-text small">
                                        {{ truncateText(movie.description, 120) }}
                                    </p>

                                    <!-- Ссылка на источник -->
                                    <a :href="movie.source_url" target="_blank" class="btn btn-sm btn-outline-info mt-2" @click.stop>
                                        🔗 Подробнее
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Пагинация -->
                    <nav v-if="!moviesLoading && moviesList.length" class="mt-4">
                        <ul class="pagination justify-content-center">
                            <li class="page-item" :class="{ disabled: !moviesHasPrev }">
                                <button class="page-link bg-dark text-light border-secondary" @click="goMoviesPage(moviesPage - 1)">← Назад</button>
                            </li>
                            <li class="page-item disabled">
                                <span class="page-link bg-dark text-secondary border-secondary">Страница {{ moviesPage }}</span>
                            </li>
                            <li class="page-item" :class="{ disabled: !moviesHasNext }">
                                <button class="page-link bg-dark text-light border-secondary" @click="goMoviesPage(moviesPage + 1)">Вперёд →</button>
                            </li>
                        </ul>
                    </nav>
                </div>
            </div>

            <div v-else-if="currentView === 'profile'" class="row justify-content-center">
                <div class="col-12 col-xl-10">
                    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
                        <a href="#/" class="link-light text-decoration-none">← На главную</a>
                    </div>
                    <div v-if="profileLoading" class="text-center py-5 text-secondary">
                        <div class="spinner-border text-info" role="status"><span class="visually-hidden">Загрузка…</span></div>
                    </div>
                    <div v-else-if="profileData" class="profile-content">
                        <ul class="nav nav-tabs profile-nav mb-3 border-secondary">
                            <li class="nav-item">
                                <button type="button" class="nav-link" :class="{ active: profileTab === 'view' }"
                                        @click="profileTab = 'view'">Просмотр</button>
                            </li>
                            <li class="nav-item">
                                <button type="button" class="nav-link" :class="{ active: profileTab === 'full' }"
                                        @click="profileTab = 'full'">Полное обновление</button>
                            </li>
                            <li class="nav-item">
                                <button type="button" class="nav-link" :class="{ active: profileTab === 'partial' }"
                                        @click="profileTab = 'partial'">Частичное обновление</button>
                            </li>
                            <li class="nav-item ms-auto">
                                <button type="button" class="nav-link text-danger" :class="{ active: profileTab === 'danger' }"
                                        @click="profileTab = 'danger'">Удаление</button>
                            </li>
                        </ul>

                        <div v-show="profileTab === 'view'" class="card shadow text-bg-dark border-secondary mb-4">
                            <div class="card-body p-4">
                                <h2 class="h5 mb-4">Текущие данные</h2>
                                <dl class="row mb-0">
                                    <dt class="col-sm-3 text-secondary">ID</dt>
                                    <dd class="col-sm-9">{{ profileData.id }}</dd>
                                    <dt class="col-sm-3 text-secondary">Фамилия</dt>
                                    <dd class="col-sm-9">{{ profileData.surname }}</dd>
                                    <dt class="col-sm-3 text-secondary">Имя</dt>
                                    <dd class="col-sm-9">{{ profileData.name }}</dd>
                                    <dt class="col-sm-3 text-secondary">Логин</dt>
                                    <dd class="col-sm-9">{{ profileData.login }}</dd>
                                    <dt class="col-sm-3 text-secondary">Email</dt>
                                    <dd class="col-sm-9">{{ profileData.email }}</dd>
                                    <dt class="col-sm-3 text-secondary">Дата регистрации</dt>
                                    <dd class="col-sm-9">{{ formatRegistrationDate(profileData.registration_date) }}</dd>
                                </dl>
                            </div>
                        </div>

                        <div v-show="profileTab === 'full'" class="card shadow text-bg-dark border-secondary mb-4">
                            <div class="card-body p-4">
                                <h2 class="h5 mb-3">Обновить все поля</h2>
                                <p class="text-secondary small mb-4">Нужно указать и пароль (текущий или новый) — требование API.</p>
                                <form @submit.prevent="onFullProfileUpdate">
                                    <div class="row g-3">
                                        <div class="col-md-6">
                                            <label class="form-label" for="full-surname">Фамилия</label>
                                            <input id="full-surname" v-model="fullUpdateForm.surname" type="text" required
                                                   class="form-control bg-dark text-light border-secondary"
                                                   minlength="3" maxlength="30">
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label" for="full-name">Имя</label>
                                            <input id="full-name" v-model="fullUpdateForm.name" type="text" required
                                                   class="form-control bg-dark text-light border-secondary"
                                                   minlength="3" maxlength="20">
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label" for="full-login">Логин</label>
                                            <input id="full-login" v-model="fullUpdateForm.login" type="text" required
                                                   class="form-control bg-dark text-light border-secondary"
                                                   minlength="3" maxlength="20">
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label" for="full-email">Email</label>
                                            <input id="full-email" v-model="fullUpdateForm.email" type="email" required
                                                   class="form-control bg-dark text-light border-secondary"
                                                   minlength="10" maxlength="40">
                                        </div>
                                        <div class="col-12">
                                            <label class="form-label" for="full-password">Пароль</label>
                                            <input id="full-password" v-model="fullUpdateForm.password" type="password" required
                                                   class="form-control bg-dark text-light border-secondary"
                                                   minlength="8" maxlength="30" autocomplete="new-password">
                                        </div>
                                    </div>
                                    <button type="submit" class="btn btn-primary mt-4" :disabled="loading">
                                        <span v-if="loading" class="spinner-border spinner-border-sm me-1" role="status"></span>
                                        Сохранить всё
                                    </button>
                                </form>
                            </div>
                        </div>

                        <div v-show="profileTab === 'partial'" class="card shadow text-bg-dark border-secondary mb-4">
                            <div class="card-body p-4">
                                <h2 class="h5 mb-3">Изменить выбранные поля</h2>
                                <p class="text-secondary small mb-4">Отметьте галочками, что менять, и введите новое значение.</p>
                                <form @submit.prevent="onPartialProfileUpdate">
                                    <div class="mb-3 pb-3 border-bottom border-secondary">
                                        <div class="form-check mb-2">
                                            <input class="form-check-input" type="checkbox" id="p-surname" v-model="partialFlags.surname">
                                            <label class="form-check-label" for="p-surname">Фамилия</label>
                                        </div>
                                        <input v-if="partialFlags.surname" v-model="partialForm.surname" type="text"
                                               class="form-control bg-dark text-light border-secondary"
                                               minlength="3" maxlength="30" placeholder="Новая фамилия">
                                    </div>
                                    <div class="mb-3 pb-3 border-bottom border-secondary">
                                        <div class="form-check mb-2">
                                            <input class="form-check-input" type="checkbox" id="p-name" v-model="partialFlags.name">
                                            <label class="form-check-label" for="p-name">Имя</label>
                                        </div>
                                        <input v-if="partialFlags.name" v-model="partialForm.name" type="text"
                                               class="form-control bg-dark text-light border-secondary"
                                               minlength="3" maxlength="20" placeholder="Новое имя">
                                    </div>
                                    <div class="mb-3 pb-3 border-bottom border-secondary">
                                        <div class="form-check mb-2">
                                            <input class="form-check-input" type="checkbox" id="p-login" v-model="partialFlags.login">
                                            <label class="form-check-label" for="p-login">Логин</label>
                                        </div>
                                        <input v-if="partialFlags.login" v-model="partialForm.login" type="text"
                                               class="form-control bg-dark text-light border-secondary"
                                               minlength="3" maxlength="20" placeholder="Новый логин">
                                    </div>
                                    <div class="mb-3 pb-3 border-bottom border-secondary">
                                        <div class="form-check mb-2">
                                            <input class="form-check-input" type="checkbox" id="p-email" v-model="partialFlags.email">
                                            <label class="form-check-label" for="p-email">Email</label>
                                        </div>
                                        <input v-if="partialFlags.email" v-model="partialForm.email" type="email"
                                               class="form-control bg-dark text-light border-secondary"
                                               minlength="10" maxlength="40" placeholder="Новый email">
                                    </div>
                                    <div class="mb-3">
                                        <div class="form-check mb-2">
                                            <input class="form-check-input" type="checkbox" id="p-password" v-model="partialFlags.password">
                                            <label class="form-check-label" for="p-password">Пароль</label>
                                        </div>
                                        <input v-if="partialFlags.password" v-model="partialForm.password" type="password"
                                               class="form-control bg-dark text-light border-secondary"
                                               minlength="8" maxlength="30" autocomplete="new-password" placeholder="Новый пароль">
                                    </div>
                                    <button type="submit" class="btn btn-primary" :disabled="loading">
                                        <span v-if="loading" class="spinner-border spinner-border-sm me-1" role="status"></span>
                                        Применить изменения
                                    </button>
                                </form>
                            </div>
                        </div>

                        <div v-show="profileTab === 'danger'" class="card shadow border-danger text-bg-dark mb-4">
                            <div class="card-body p-4">
                                <h2 class="h5 text-danger mb-3">Удаление аккаунта</h2>
                                <p class="text-secondary mb-4">Будут удалены ваш профиль и связанные данные. Это действие нельзя отменить.</p>
                                <button type="button" class="btn btn-outline-danger" data-bs-toggle="modal" data-bs-target="#deleteProfileModal">
                                    Удалить мой аккаунт…
                                </button>
                            </div>
                        </div>
                    </div>
                    <div v-else class="card text-bg-dark border-secondary shadow">
                        <div class="card-body p-4 text-secondary">
                            Профиль не загружен.
                            <button type="button" class="btn btn-sm btn-outline-info ms-2" @click="loadProfile">Повторить</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <div class="modal fade" id="deleteProfileModal" tabindex="-1" aria-labelledby="deleteProfileModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content text-bg-dark border-danger">
                    <div class="modal-header border-secondary">
                        <h5 class="modal-title" id="deleteProfileModalLabel">Подтверждение удаления</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Закрыть"></button>
                    </div>
                    <div class="modal-body">
                        Удалить аккаунт без возможности восстановления? Все сохранённые данные профиля будут потеряны.
                    </div>
                    <div class="modal-footer border-secondary">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                        <button type="button" class="btn btn-danger" @click="confirmDeleteProfile" :disabled="loading">
                            <span v-if="loading" class="spinner-border spinner-border-sm me-1" role="status"></span>
                            Да, удалить
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</script>

<script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/config.js"></script>
<script src="/js/tokenStore.js"></script>
<script src="/js/api.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
