services:
  movie-catalog:
    build: ./
    container_name: movie-catalog
    environment:
      DATABASE__HOST: database
      REDIS__CONNECTION__HOST: redis
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy

  database:
    image: postgres:17-bookworm
    container_name: database
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: movie-catalog
    ports:
      - "5433:5432"
    volumes:
      - "postgres-data:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d test-movie-catalog"]
      start_period: 3s
      interval: 2s
      timeout: 2s
      retries: 3

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: postgres@postgres.com
      PGADMIN_DEFAULT_PASSWORD: postgres
    ports:
      - "5050:80"

  redis:
    image: redis:latest
    container_name: cache
    ports:
      - "6379:6379"
    volumes:
      - "redis-data:/data"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      start_period: 1s
      interval: 2s
      timeout: 2s
      retries: 3

  redis_gui:
    image: redis/redisinsight
    container_name: redis_gui
    ports:
      - "5540:5540"

volumes:
  postgres-data:
  redis-data:
