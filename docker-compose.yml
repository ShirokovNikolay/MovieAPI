services:
  movie-catalog:
    build: ./
    container_name: movie-catalog
    environment:
      DATABASE__HOST: database
      REDIS__CONNECTION__HOST: redis
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - database

  database:
    image: postgres:17-bookworm
    container_name: database
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: movie-catalog
    ports:
      - "5432:5432"
    volumes:
      - "postgres-data:/var/lib/postgresql/data"

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: postgres@postgres.com
      PGADMIN_DEFAULT_PASSWORD: postgres
    ports:
      - "5050:80"

  redis:
    image: redis:latest
    container_name: cache
    ports:
      - "6379:6379"
    volumes:
      - "redis-data:/data"

volumes:
  postgres-data:
  redis-data:
