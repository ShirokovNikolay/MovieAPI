<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Регистрация — Movie API</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="shell">
      <div class="card">
        <h1>Регистрация</h1>
        <p class="sub">POST /api/v1/auth/register</p>
        <div id="msg" class="msg" role="alert"></div>
        <form id="form" novalidate>
          <label for="surname">Фамилия</label>
          <input
            id="surname"
            name="surname"
            type="text"
            required
            minlength="3"
            maxlength="30"
            autocomplete="family-name"
          />
          <label for="name">Имя</label>
          <input
            id="name"
            name="name"
            type="text"
            required
            minlength="3"
            maxlength="20"
            autocomplete="given-name"
          />
          <label for="login">Логин</label>
          <input
            id="login"
            name="login"
            type="text"
            required
            minlength="3"
            maxlength="20"
            autocomplete="username"
          />
          <label for="email">Email</label>
          <input
            id="email"
            name="email"
            type="email"
            required
            minlength="10"
            maxlength="40"
            autocomplete="email"
          />
          <label for="password">Пароль</label>
          <input
            id="password"
            name="password"
            type="password"
            required
            minlength="8"
            maxlength="30"
            autocomplete="new-password"
          />
          <button type="submit" id="submit">Создать аккаунт</button>
        </form>
        <p class="footer-nav">Уже есть аккаунт? <a href="login.html">Войти</a></p>
        <p class="footer-nav"><a href="index.html">На главную</a></p>
      </div>
    </div>
    <script src="auth.js"></script>
    <script>
      const form = document.getElementById("form");
      const msg = document.getElementById("msg");
      const submitBtn = document.getElementById("submit");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        hideMessage(msg);
        submitBtn.disabled = true;
        const payload = {
          surname: document.getElementById("surname").value.trim(),
          name: document.getElementById("name").value.trim(),
          login: document.getElementById("login").value.trim(),
          email: document.getElementById("email").value.trim(),
          password: document.getElementById("password").value,
        };
        try {
          const user = await registerUser(payload);
          showMessage(
            msg,
            `Аккаунт создан: ${user.login} (id ${user.id}). Можно войти.`,
            "success"
          );
          form.reset();
        } catch (err) {
          showMessage(msg, err.message || "Ошибка", "error");
        } finally {
          submitBtn.disabled = false;
        }
      });
    </script>
  </body>
</html>
